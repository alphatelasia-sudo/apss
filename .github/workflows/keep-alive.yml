name: Keep Alive

on:
  schedule:
    - cron: "*/25 * * * *"   # every 25 minutes
  workflow_dispatch:           # run manually from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping APSS
        run: curl -s -o /dev/null -w "%{http_code}" https://apss-alphatelasia.streamlit.app
